# DragonPBX UI reverse proxy (installed by the dragonpbx-ui package).
#
# To enable HTTPS:
#   1. Set server_name below to your FQDN.
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d <your-fqdn>        # adds the :443 block + cert
#   4. In /opt/dragonpbx-ui/config/dragonpbx-ui.env set
#        DRAGONPBX_UI_ORIGINS=https://<your-fqdn>
#      then: sudo systemctl restart dragonpbx-ui
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;            # <-- change to your FQDN before running certbot

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        # Sails uses websockets (socket.io); these headers keep them working.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
